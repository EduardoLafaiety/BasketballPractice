# Publica a versão de demonstração (sem backend: a API roda no navegador) no GitHub Pages.
# O site normal, com API e Postgres, não é afetado.
name: Demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # As rotas do backend entram no pacote da demonstração (zod e os tipos vêm das dependências dele).
      - name: Dependências do backend
        run: npm ci
        working-directory: backend

      - name: Dependências do site
        run: npm ci
        working-directory: frontend

      - name: Testes do site
        run: npm test
        working-directory: frontend

      - name: Build da demonstração
        run: npm run build:demo
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # O Pages não conhece as rotas do app: um link direto (ex.: /metas) cai no 404.html, que é o próprio app.
      - name: Fallback de rotas
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
