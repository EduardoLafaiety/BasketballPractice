# Publica a versão de demonstração (sem backend: a API roda no navegador) no GitHub Pages.
# O site normal, com API e Postgres, não é afetado.
name: Demonstração no GitHub Pages

on:
  push:
    branches: [main]
  # A demonstração não tem servidor: republicar é o que atualiza as notícias da barra (4 consultas por dia ao GNews).
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # As rotas do backend entram no pacote da demonstração (zod e os tipos vêm das dependências dele).
      - name: Dependências do backend
        run: npm ci
        working-directory: backend

      - name: Dependências do site
        run: npm ci
        working-directory: frontend

      - name: Testes do site
        run: npm test
        working-directory: frontend

      - name: Build da demonstração
        run: npm run build:demo
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # O Pages não conhece as rotas do app: um link direto (ex.: /metas) cai no 404.html, que é o próprio app.
      - name: Fallback de rotas
        run: cp frontend/dist/index.html frontend/dist/404.html

      # Sem o secret GNEWS_API_KEY, saem as manchetes escritas à mão (backend/src/lib/curated-news.ts).
      - name: Notícias da barra
        run: npx tsx src/scripts/export-news.ts ../frontend/dist/noticias.json
        working-directory: backend
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}

      # Versão de avaliação da repaginada, em /previa/site/, gerada da branch dela. O site oficial não muda.
      # Remover este trecho ao publicar a repaginada.
      - uses: actions/checkout@v7
        with:
          ref: repaginada
          path: _repaginada

      - name: Build da versão de avaliação
        working-directory: _repaginada
        run: |
          (cd backend && npm ci)
          (cd frontend && npm ci && VITE_BASE=/${{ github.event.repository.name }}/previa/site/ npm run build:demo)
          rm -rf frontend/dist/previa
          # O Pages só conhece arquivos: cada rota ganha uma cópia da página, para recarregar e abrir links diretos.
          cd frontend/dist
          for rota in treinos jogue-como rotina desempenho metas ferramentas gerador configuracoes sessao; do
            mkdir -p "$rota" && cp index.html "$rota/index.html"
          done
          for id in $(seq 1 200); do mkdir -p "treinos/$id" && cp index.html "treinos/$id/index.html"; done
          for foto in ../src/assets/jogadores/*-520.webp; do
            id=$(basename "$foto" -520.webp)
            mkdir -p "jogue-como/$id" && cp index.html "jogue-como/$id/index.html"
          done
          cd ../../..
          mkdir -p frontend/dist/previa/site
          cp -r _repaginada/frontend/dist/. frontend/dist/previa/site/
          cp frontend/dist/noticias.json frontend/dist/previa/site/noticias.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
