name: Teste LNB (temporário)
on:
  push:
    branches: [nbb-teste-lnb]
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Script de verdade
        run: |
          npx tsx src/scripts/export-nbb.ts /tmp/nbb.json
          head -c 400 /tmp/nbb.json; echo
        working-directory: backend
