# A API no plano grátis do Render dorme após 15 minutos sem visitas e leva cerca de 1 minuto para acordar.
# Este workflow chama /api/health a cada 5 minutos para ela não dormir (e, de quebra, avisa se ela cair).
# O repositório é público, então os minutos do Actions são gratuitos.
name: Manter a API acordada

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar /api/health
        run: |
          # Se a API estiver dormindo, a primeira chamada espera o boot (até ~2 min); tenta de novo se precisar.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 10 --retry-all-errors https://basketball-practice-api.onrender.com/api/health)
          echo "HTTP $code"
          test "$code" = "200"
